AWSTemplateFormatVersion: "2010-09-09"
Description: Dos EC2 con Nested Stacks y cloud-init

Parameters:
  ProjectName:
    Type: String
    Default: iac-cloud-init

  VpcId:
    Type: AWS::EC2::VPC::Id

  FrontendSubnetId:
    Type: AWS::EC2::Subnet::Id

  BackendSubnetId:
    Type: AWS::EC2::Subnet::Id

  UbuntuAmi:
    Type: AWS::EC2::Image::Id

  InstanceType:
    Type: String
    Default: t3.micro

  VolumeSize:
    Type: Number
    Default: 20

  SshCidr:
    Type: String
    Default: 0.0.0.0/0

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested/frontend.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !Ref VpcId
        SubnetId: !Ref FrontendSubnetId
        UbuntuAmi: !Ref UbuntuAmi
        InstanceType: !Ref InstanceType
        VolumeSize: !Ref VolumeSize
        SshCidr: !Ref SshCidr
        KeyName: !Ref KeyName

  BackendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./nested/backend.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !Ref VpcId
        SubnetId: !Ref BackendSubnetId
        UbuntuAmi: !Ref UbuntuAmi
        InstanceType: !Ref InstanceType
        VolumeSize: !Ref VolumeSize
        SshCidr: !Ref SshCidr
        KeyName: !Ref KeyName

Outputs:
  FrontendInstanceId:
    Value: !GetAtt FrontendStack.Outputs.InstanceId

  FrontendPublicIp:
    Value: !GetAtt FrontendStack.Outputs.PublicIp

  FrontendPrivateIp:
    Value: !GetAtt FrontendStack.Outputs.PrivateIp

  BackendInstanceId:
    Value: !GetAtt BackendStack.Outputs.InstanceId

  BackendPublicIp:
    Value: !GetAtt BackendStack.Outputs.PublicIp

  BackendPrivateIp:
    Value: !GetAtt BackendStack.Outputs.PrivateIp
