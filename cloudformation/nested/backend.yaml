AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Backend NestJS con cloud-init

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  UbuntuAmi:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
  VolumeSize:
    Type: Number
  SshCidr:
    Type: String
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH laboratorio backend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation
        - Key: Role
          Value: backend

  BackendEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName

      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref BackendSecurityGroup

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true

      UserData:
        Fn::Base64: |
          __CLOUD_INIT_CONTENT__

      Tags:
        - Key: Name
          Value: iac-cloud-init-backend
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation
        - Key: Role
          Value: backend

Outputs:
  InstanceId:
    Value: !Ref BackendEC2

  PublicIp:
    Value: !GetAtt BackendEC2.PublicIp

  PrivateIp:
    Value: !GetAtt BackendEC2.PrivateIp
