AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Frontend React con cloud-init

Parameters:
  ProjectName:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id

  UbuntuAmi:
    Type: AWS::EC2::Image::Id

  InstanceType:
    Type: String

  VolumeSize:
    Type: Number

  SshCidr:
    Type: String

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH y HTTP laboratorio frontend
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH laboratorio

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP publico - Nginx

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation
        - Key: Role
          Value: frontend

  FrontendEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName

      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref FrontendSecurityGroup

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true

      UserData:
        Fn::Base64: |
          __CLOUD_INIT_CONTENT__

      Tags:
        - Key: Name
          Value: iac-cloud-init-frontend
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation
        - Key: Role
          Value: frontend

Outputs:
  InstanceId:
    Description: ID de instancia EC2 frontend
    Value: !Ref FrontendEC2

  PublicIp:
    Description: IP publica del frontend
    Value: !GetAtt FrontendEC2.PublicIp

  PrivateIp:
    Description: IP privada del frontend
    Value: !GetAtt FrontendEC2.PrivateIp
